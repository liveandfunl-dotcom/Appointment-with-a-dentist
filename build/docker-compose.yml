# Запуск из корня репозитория: docker compose -f build/docker-compose.yml up -d --build
# Переменные берутся из build/.env (шаблон — build/.env.example) или из окружения.
services:
  app:
    build:
      context: ..
      dockerfile: build/Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      CLINIC_TZ: ${CLINIC_TZ:-Europe/Athens}
      SEED_DEV: ${SEED_DEV:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Clinic <noreply@clinic.local>}
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
